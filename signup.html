<!DOCTYPE html>
<html>
    <head>
        <title>Gym Membership System - Sign Up</title>
        <link rel="stylesheet" type="text/css" href="styles.css">
    </head>
    <body>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="login.html">Login</a>
            <a href="signup.html">Sign Up</a>
        </nav>
        <h1>Create Your Gym Account</h1>
        <p>Register to become a member of our gym.</p>
        <form>
            <p><label>Full Name: <input type="text" name="fullname" required></label></p>
            <p><label>Phone Number: <input type="tel" name="phone" required></label></p>
            <p><label>Email: <input type="email" name="email" required></label></p>
            <p><label>Password: <input type="password" name="password" required></label></p>
            <input type="submit" value="Sign Up" class="gymButton">
        </form>
        <h2>Cardio Training Area</h2>
<p>Discover our modern cardio equipment.</p>

<img src="images/gym-cardio.png"
     alt="Cardio Training Area"
     class="gym-photo"
     usemap="#gymmap">

<map name="gymmap">
    <area shape="default"
          href="about.html"
          alt="About Our Gym">
</map>
        
    </body>
</html>
